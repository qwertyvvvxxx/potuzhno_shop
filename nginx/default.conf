# Django (gunicorn) — сервіс "web" з docker-compose.yml, порт 8000
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Максимальний розмір тіла запиту
    client_max_body_size 10M;

    # Стискаємо текст/JS/CSS/JSON — бандл React стає у кілька разів меншим
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Усе, що починається з /api/, /admin/, /graphql/, /api-auth/ — на Django
    location ~ ^/(api|admin|graphql|api-auth)(/|$) {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика Django (адмінка, DRF, Swagger) — її збирає collectstatic у спільний volume
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    # Збірка React: імена файлів містять хеш (index-a1b2c3.js), тому кешуємо назавжди
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA: якщо файл існує — віддаємо його, інакше index.html
    # (маршрути на кшталт /products/hoodie обробляє React Router у браузері)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
