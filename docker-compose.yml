# Повний prod-стек: PostgreSQL + Django (gunicorn) + nginx (React + reverse-proxy).
# Запуск: docker compose up --build -d   → http://localhost/
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env  # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./potuzhno_shop
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db  # у Docker база доступна за іменем сервісу, а не localhost
      DJANGO_DEBUG: "False"  # у контейнері завжди prod-режим, що б не було в .env
    volumes:
      - static_files:/app/staticfiles  # сюди collectstatic складає статику для nginx
    depends_on:
      db:
        condition: service_healthy  # стартуємо лише коли Postgres готовий приймати з'єднання

  nginx:
    build:
      context: .  # корінь репо, бо образу потрібні і frontend/, і nginx/
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"  # єдиний порт, відкритий назовні
    volumes:
      - static_files:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  pgdata:
  static_files:
